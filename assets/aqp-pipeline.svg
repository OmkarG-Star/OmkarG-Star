<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="India Air Quality Data Platform pipeline: built ingestion, raw and bronze layers and quality checks; planned Airflow, dbt and forecasting">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0284C7"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px}
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="249" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

    <g class="t s">
    <rect x="32" y="23" width="12" height="12" rx="3" fill="#F0F9FF" stroke="#0284C7"/><text x="50" y="34" fill="#475569">built &amp; running daily</text>
    <rect x="200" y="23" width="12" height="12" rx="3" fill="none" stroke="#94A3B8" stroke-dasharray="3 3"/><text x="218" y="34" fill="#475569">next milestones</text>
  </g>

  <!-- built -->
  <g class="t">
    <rect x="32" y="70" width="150" height="74" rx="12" fill="#F0F9FF" stroke="#0284C7"/>
    <text x="107" y="100" class="h" text-anchor="middle" fill="#0F172A">Open-Meteo API</text>
    <text x="107" y="122" class="s" text-anchor="middle" fill="#475569">hourly · Indian cities</text>

    <rect x="222" y="70" width="160" height="74" rx="12" fill="#F0F9FF" stroke="#0284C7"/>
    <text x="302" y="100" class="h" text-anchor="middle" fill="#0F172A">Python ingestion</text>
    <text x="302" y="122" class="s" text-anchor="middle" fill="#475569">retries · idempotent loads</text>

    <rect x="422" y="58" width="150" height="44" rx="10" fill="#F0F9FF" stroke="#0284C7"/>
    <text x="497" y="85" class="s" text-anchor="middle" fill="#0F172A">Raw · JSON by date</text>
    <rect x="422" y="112" width="150" height="44" rx="10" fill="#F0F9FF" stroke="#0284C7"/>
    <text x="497" y="139" class="s" text-anchor="middle" fill="#0F172A">Bronze · Parquet</text>

    <rect x="612" y="70" width="150" height="74" rx="12" fill="#F0F9FF" stroke="#0284C7"/>
    <text x="687" y="100" class="h" text-anchor="middle" fill="#0F172A">Quality checks</text>
    <text x="687" y="122" class="s" text-anchor="middle" fill="#475569">dupes · gaps · nulls</text>
  </g>
  <g stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M182 107 H218"/>
    <path d="M382 100 C400 100 400 80 418 80"/>
    <path d="M382 114 C400 114 400 134 418 134"/>
    <path d="M572 134 C590 134 590 107 608 107"/>
  </g>

  <!-- next -->
  <g class="t">
    <rect x="802" y="70" width="110" height="74" rx="12" fill="none" stroke="#94A3B8" stroke-dasharray="5 5"/>
    <text x="857" y="100" class="h" text-anchor="middle" fill="#475569">Airflow</text>
    <text x="857" y="122" class="s" text-anchor="middle" fill="#94A3B8">+ cloud storage</text>

    <rect x="942" y="70" width="100" height="74" rx="12" fill="none" stroke="#94A3B8" stroke-dasharray="5 5"/>
    <text x="992" y="100" class="h" text-anchor="middle" fill="#475569">dbt</text>
    <text x="992" y="122" class="s" text-anchor="middle" fill="#94A3B8">silver · gold</text>

    <rect x="1072" y="70" width="100" height="74" rx="12" fill="none" stroke="#94A3B8" stroke-dasharray="5 5"/>
    <text x="1122" y="100" class="h" text-anchor="middle" fill="#475569">Forecast</text>
    <text x="1122" y="122" class="s" text-anchor="middle" fill="#94A3B8">AQI · dashboard</text>
  </g>
  <g stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#b)">
    <path d="M762 107 H798"/><path d="M912 107 H938"/><path d="M1042 107 H1068"/>
  </g>

  <!-- footer facts -->
  <g class="t s" fill="#475569">
    <text x="32" y="200">Runs every morning at 07:00 IST on GitHub Actions</text>
    <text x="400" y="200">One city failing never blocks the others</text>
    <text x="720" y="200">13 pytest tests · Ruff · CI on every push</text>
  </g>
  <line x1="32" y1="176" x2="1168" y2="176" stroke="#E2E8F0"/>
</svg>
